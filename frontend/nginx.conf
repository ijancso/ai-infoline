server {
    listen 80;
    server_name infoline.dev www.infoline.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name infoline.dev www.infoline.dev;

    ssl_certificate /etc/letsencrypt/live/infoline.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infoline.dev/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /admin {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /twilio {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
