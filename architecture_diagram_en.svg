<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="720" viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="twilioGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fb7185;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="storageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="720" fill="#f8fafc"/>

  <!-- Title -->
  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">AI Infoline — System Architecture</text>
  <text x="500" y="55" text-anchor="middle" font-size="11" fill="#64748b">Scalable, cloud-native AI-powered phone support platform</text>

  <!-- Cloud boundary -->
  <rect x="18" y="66" width="964" height="638" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="34" y="83" font-size="10" fill="#94a3b8">DigitalOcean Cloud  (auto-scaling)</text>

  <!-- ── Callers ── -->
  <rect x="36" y="100" width="130" height="82" rx="9" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="101" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Callers</text>
  <text x="101" y="143" text-anchor="middle" font-size="10" fill="#64748b">(end users)</text>
  <text x="101" y="175" text-anchor="middle" font-size="10" fill="#94a3b8">~1000+ concurrent</text>

  <!-- ── Tenants ── -->
  <rect x="36" y="210" width="130" height="72" rx="9" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="101" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Tenants</text>
  <text x="101" y="254" text-anchor="middle" font-size="10" fill="#64748b">(tenant portal)</text>
  <text x="101" y="274" text-anchor="middle" font-size="10" fill="#94a3b8">self-service</text>

  <!-- ── Admin ── -->
  <rect x="36" y="312" width="130" height="72" rx="9" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="101" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Admin</text>
  <text x="101" y="356" text-anchor="middle" font-size="10" fill="#64748b">(admin portal)</text>
  <text x="101" y="376" text-anchor="middle" font-size="10" fill="#94a3b8">full control</text>

  <!-- ── Twilio ── -->
  <rect x="205" y="92" width="132" height="96" rx="9" fill="url(#twilioGrad)" filter="url(#shadow)"/>
  <text x="271" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Twilio</text>
  <text x="271" y="142" text-anchor="middle" font-size="10" fill="#ffe4e6">Telephony Platform</text>
  <text x="271" y="158" text-anchor="middle" font-size="10" fill="#ffe4e6">STT · TTS · Recording</text>
  <text x="271" y="180" text-anchor="middle" font-size="10" fill="#ffe4e6">Webhooks · TwiML</text>

  <!-- ── Load Balancer ── -->
  <rect x="374" y="178" width="132" height="66" rx="9" fill="url(#lbGrad)" filter="url(#shadow)"/>
  <text x="440" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Load Balancer</text>
  <text x="440" y="224" text-anchor="middle" font-size="10" fill="#e0f7fa">HTTPS · TLS termination</text>
  <text x="440" y="238" text-anchor="middle" font-size="10" fill="#e0f7fa">Round-robin routing</text>

  <!-- ── API pods group ── -->
  <rect x="368" y="280" width="144" height="196" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="440" y="300" text-anchor="middle" font-size="10" fill="#3b82f6">auto-scaled pods</text>

  <rect x="378" y="310" width="124" height="50" rx="7" fill="url(#apiGrad)" filter="url(#shadow)"/>
  <text x="440" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">FastAPI  #1</text>
  <text x="440" y="349" text-anchor="middle" font-size="10" fill="#dbeafe">Python 3.12 · async</text>

  <rect x="378" y="370" width="124" height="50" rx="7" fill="url(#apiGrad)" filter="url(#shadow)" opacity="0.85"/>
  <text x="440" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">FastAPI  #2</text>
  <text x="440" y="409" text-anchor="middle" font-size="10" fill="#dbeafe">Python 3.12 · async</text>

  <text x="440" y="444" text-anchor="middle" font-size="16" fill="#3b82f6">. . .</text>
  <text x="440" y="464" text-anchor="middle" font-size="10" fill="#93c5fd">FastAPI  #N</text>

  <!-- ── Claude AI ── -->
  <rect x="558" y="92" width="140" height="96" rx="9" fill="url(#aiGrad)" filter="url(#shadow)"/>
  <text x="628" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Claude AI</text>
  <text x="628" y="142" text-anchor="middle" font-size="10" fill="#ede9fe">Anthropic · Haiku model</text>
  <text x="628" y="158" text-anchor="middle" font-size="10" fill="#ede9fe">Prompt caching</text>
  <text x="628" y="175" text-anchor="middle" font-size="10" fill="#ede9fe">150 tokens / turn</text>

  <!-- ── PostgreSQL ── -->
  <rect x="558" y="216" width="140" height="96" rx="9" fill="url(#dbGrad)" filter="url(#shadow)"/>
  <text x="628" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">PostgreSQL 16</text>
  <text x="628" y="266" text-anchor="middle" font-size="10" fill="#d1fae5">Managed · Multi-node</text>
  <text x="628" y="282" text-anchor="middle" font-size="10" fill="#d1fae5">Tenants · Calls</text>
  <text x="628" y="298" text-anchor="middle" font-size="10" fill="#d1fae5">Messages · Recordings</text>

  <!-- ── DO Spaces ── -->
  <rect x="558" y="338" width="140" height="92" rx="9" fill="url(#storageGrad)" filter="url(#shadow)"/>
  <text x="628" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">DO Spaces</text>
  <text x="628" y="386" text-anchor="middle" font-size="10" fill="#fef3c7">S3-compatible · versioned</text>
  <text x="628" y="402" text-anchor="middle" font-size="10" fill="#fef3c7">Private ACL</text>
  <text x="628" y="418" text-anchor="middle" font-size="10" fill="#fef3c7">Call recordings (MP3)</text>

  <!-- ── Stripe ── -->
  <rect x="558" y="456" width="140" height="68" rx="9" fill="#fff" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="628" y="484" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">Stripe</text>
  <text x="628" y="502" text-anchor="middle" font-size="10" fill="#6366f1">Payment processing</text>
  <text x="628" y="517" text-anchor="middle" font-size="10" fill="#a5b4fc">Subscription mgmt</text>

  <!-- ── React Frontend ── -->
  <rect x="190" y="454" width="158" height="76" rx="9" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="269" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">React 18 + Vite</text>
  <text x="269" y="497" text-anchor="middle" font-size="10" fill="#64748b">Admin + Tenant Portal</text>
  <text x="269" y="513" text-anchor="middle" font-size="10" fill="#94a3b8">Tailwind · Nginx · Docker</text>

  <!-- ── Monitoring ── -->
  <rect x="190" y="554" width="158" height="68" rx="9" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="269" y="580" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Monitoring</text>
  <text x="269" y="597" text-anchor="middle" font-size="10" fill="#64748b">Structured logging</text>
  <text x="269" y="613" text-anchor="middle" font-size="10" fill="#94a3b8">ELK stack</text>

  <!-- ── Terraform ── -->
  <rect x="374" y="498" width="144" height="68" rx="9" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="446" y="524" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Terraform IaC</text>
  <text x="446" y="541" text-anchor="middle" font-size="10" fill="#64748b">DB · Spaces · Infra</text>
  <text x="446" y="557" text-anchor="middle" font-size="10" fill="#94a3b8">Versioned config</text>

  <!-- ════ ARROWS ════ -->
  <!-- Callers → Twilio -->
  <line x1="166" y1="138" x2="203" y2="138" stroke="#e11d48" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="185" y="132" text-anchor="middle" font-size="9" fill="#94a3b8">PSTN</text>

  <!-- Twilio → Load Balancer -->
  <line x1="337" y1="140" x2="372" y2="205" stroke="#e11d48" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="368" y="170" text-anchor="middle" font-size="9" fill="#64748b">webhook</text>

  <!-- Tenants → Load Balancer -->
  <line x1="166" y1="248" x2="372" y2="224" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray)" stroke-dasharray="4,3"/>
  <text x="278" y="230" text-anchor="middle" font-size="9" fill="#94a3b8">HTTPS API</text>

  <!-- Admin → Load Balancer -->
  <line x1="166" y1="345" x2="372" y2="234" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray)" stroke-dasharray="4,3"/>

  <!-- Load Balancer → API pods -->
  <line x1="440" y1="244" x2="440" y2="278" stroke="#0891b2" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- API → Claude -->
  <line x1="512" y1="330" x2="556" y2="158" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <text x="548" y="268" text-anchor="middle" font-size="9" fill="#7c3aed">LLM req</text>

  <!-- API → PostgreSQL -->
  <line x1="512" y1="360" x2="556" y2="292" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="547" y="332" text-anchor="middle" font-size="9" fill="#10b981">SQLAlchemy</text>

  <!-- API → DO Spaces -->
  <line x1="512" y1="390" x2="556" y2="390" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
  <text x="534" y="382" text-anchor="middle" font-size="9" fill="#d97706">boto3</text>

  <!-- API → Stripe -->
  <line x1="512" y1="420" x2="556" y2="475" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrowGray)" stroke-dasharray="4,3"/>

  <!-- Twilio → DO Spaces (recording) -->
  <line x1="337" y1="168" x2="556" y2="368" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)" stroke-dasharray="4,3"/>
  <text x="460" y="260" text-anchor="middle" font-size="9" fill="#d97706">recording</text>

  <!-- React → Load Balancer -->
  <line x1="269" y1="454" x2="408" y2="244" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray)" stroke-dasharray="4,3"/>

  <!-- API → Monitoring -->
  <line x1="440" y1="476" x2="350" y2="588" stroke="#cbd5e1" stroke-width="1.3" marker-end="url(#arrowGray)" stroke-dasharray="3,4"/>

  <!-- ════ LEGEND ════ -->
  <rect x="728" y="84" width="252" height="310" rx="11" fill="#fff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="854" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Legend</text>
  <line x1="740" y1="115" x2="968" y2="115" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="742" y="126" width="14" height="14" rx="3" fill="url(#twilioGrad)"/>
  <text x="764" y="138" font-size="11" fill="#334155">Telephony (Twilio)</text>

  <rect x="742" y="148" width="14" height="14" rx="3" fill="url(#lbGrad)"/>
  <text x="764" y="160" font-size="11" fill="#334155">Load Balancer</text>

  <rect x="742" y="170" width="14" height="14" rx="3" fill="url(#apiGrad)"/>
  <text x="764" y="182" font-size="11" fill="#334155">API layer (auto-scaled)</text>

  <rect x="742" y="192" width="14" height="14" rx="3" fill="url(#aiGrad)"/>
  <text x="764" y="204" font-size="11" fill="#334155">AI engine (Claude)</text>

  <rect x="742" y="214" width="14" height="14" rx="3" fill="url(#dbGrad)"/>
  <text x="764" y="226" font-size="11" fill="#334155">Database (PostgreSQL)</text>

  <rect x="742" y="236" width="14" height="14" rx="3" fill="url(#storageGrad)"/>
  <text x="764" y="248" font-size="11" fill="#334155">Object storage (Spaces)</text>

  <rect x="742" y="258" width="14" height="14" rx="3" fill="#fff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="764" y="270" font-size="11" fill="#334155">Payments (Stripe)</text>

  <rect x="742" y="280" width="14" height="14" rx="3" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="764" y="292" font-size="11" fill="#334155">External / support</text>

  <line x1="742" y1="310" x2="756" y2="310" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="764" y="314" font-size="11" fill="#334155">Synchronous request</text>

  <line x1="742" y1="330" x2="756" y2="330" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#arrowGray)"/>
  <text x="764" y="334" font-size="11" fill="#334155">Async / optional</text>

  <line x1="742" y1="350" x2="756" y2="350" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#arrowAmber)"/>
  <text x="764" y="354" font-size="11" fill="#334155">Recording upload</text>

  <line x1="742" y1="370" x2="756" y2="370" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <text x="764" y="374" font-size="11" fill="#334155">LLM inference</text>

  <!-- ════ TECH STACK ════ -->
  <rect x="728" y="410" width="252" height="270" rx="11" fill="#fff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="854" y="434" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Tech Stack</text>
  <line x1="740" y1="441" x2="968" y2="441" stroke="#e2e8f0" stroke-width="1"/>
  <text x="742" y="460" font-size="10" fill="#475569">Backend:    FastAPI 0.115 · Python 3.12</text>
  <text x="742" y="477" font-size="10" fill="#475569">ORM:        SQLAlchemy 2.0 (async) · Alembic</text>
  <text x="742" y="494" font-size="10" fill="#475569">AI:         Anthropic SDK · Claude Haiku</text>
  <text x="742" y="511" font-size="10" fill="#475569">Telephony:  Twilio SDK 9.3 · TwiML</text>
  <text x="742" y="528" font-size="10" fill="#475569">Frontend:   React 18 · Vite 5 · Tailwind CSS</text>
  <text x="742" y="545" font-size="10" fill="#475569">Infra:      DigitalOcean · Terraform</text>
  <text x="742" y="562" font-size="10" fill="#475569">Container:  Docker · Nginx</text>
  <text x="742" y="579" font-size="10" fill="#475569">Storage:    DO Spaces (S3) · PostgreSQL 16</text>
  <text x="742" y="596" font-size="10" fill="#475569">Payments:   Stripe SDK 10</text>
  <text x="742" y="613" font-size="10" fill="#475569">Auth:       API key · tenant isolation</text>
  <text x="742" y="630" font-size="10" fill="#475569">Scaling:    Horizontal · stateless API</text>
  <text x="742" y="647" font-size="10" fill="#475569">Language:   Hungarian (hu-HU)</text>
  <text x="742" y="664" font-size="10" fill="#475569">TTS voice:  Google hu-HU-Standard-A</text>

  <!-- Footer -->
  <text x="500" y="710" text-anchor="middle" font-size="10" fill="#94a3b8">AI Infoline · Multi-tenant SaaS · DigitalOcean Cloud · 2024–2025</text>
</svg>
